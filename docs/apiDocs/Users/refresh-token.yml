info:
  name: refresh-token
  type: http
  seq: 4

http:
  method: post
  url: "{{baseUrl}}users/refresh-token"
  body:
    type: json
    data: |-
      {
        "refresh_token":{{refresh_token}}
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        let data = res.body;
        bru.setVar("access_token", data.result.access_token);
        console.log(data.result.access_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
