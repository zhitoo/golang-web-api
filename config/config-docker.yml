Server:
  Port: 5050
  RunMode: debug
Logger:
  FileName: ../logs/app.log
  Encoding: json
  Level: debug
Cors:
  AllowOrigins: "*"
Postgres:
  Host: postgres_con
  Port: 5432
  User: postgres
  Password: secret
  DB: carsale
  SslMode: disable
  TimeZone: Asia/Tehran
