  Port: 6379
  Password: password
  DB: 0
  DialTimeout: 5
  ReadTimeout: 5
  WriteTimeout: 5
  PoolSize: 10
  PoolTimeout: 15
  IdleCheckFrequency: 500
  IdleTimeout: 500